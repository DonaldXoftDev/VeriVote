
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | VeriVote</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif']
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#4f46e5',
              600: '#4338ca',
              700: '#3730a3'
            }
          }
        }
      }
    }
  </script>
  
</head>

<body class="bg-[#f8fafc] text-slate-900 font-sans antialiased min-h-screen">

  <!-- NAVBAR -->
  <nav class="bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-6 py-5">

      <a href="/index.html" class="flex items-center gap-3 w-fit">
        <div class="w-11 h-11 bg-[#111827] rounded-xl flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24" fill="none"
            stroke="white" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"
            class="w-6 h-6">
            <path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <span class="text-2xl font-bold">VeriVote</span>
      </a>

    </div>
  </nav>

  <!-- LOGIN SECTION -->
  <main class=" login-pagemin-h-[85vh] flex items-center justify-center px-5 py-12">

    <section class="w-full max-w-lg bg-white border border-slate-200 rounded-3xl shadow-sm p-7 sm:p-10">

      <div class="text-center mb-8">

        <div class="w-14 h-14 bg-brand-50 text-brand-600 rounded-2xl flex items-center justify-center mx-auto mb-5">
          <svg xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2"
            class="w-7 h-7">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <path d="m10 17 5-5-5-5"/>
            <path d="M15 12H3"/>
          </svg>
        </div>

        <h1 class="text-3xl font-bold text-[#111827]">
          Welcome Back
        </h1>

        <p class="text-slate-500 mt-3 leading-relaxed">
          Sign in to your VeriVote account to continue.
        </p>

      </div>

      <!-- ERROR ALERT -->
      <div id="login-error"
        class="hidden mb-5 p-4 bg-red-50 border border-red-200 text-red-700 rounded-xl text-sm"
        role="alert">
        Login failed. Please check your email and password.
      </div>

      <!-- LOGIN FORM -->
      <form id="login-form" class="space-y-6">

        <div>
          <label for="login-email"
            class="block text-sm font-semibold text-slate-700 mb-2">
            Email Address
          </label>

          <input
            type="email"
            id="login-email"
            name="email"
            placeholder="Enter your email address"
            required
            class="w-full px-4 py-3.5 border border-slate-300 rounded-xl outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-100 transition">
        </div>

        <div>
          <label for="login-password"
            class="block text-sm font-semibold text-slate-700 mb-2">
            Password
          </label>

          <input
            type="password"
            id="login-password"
            name="password"
            placeholder="Enter your password"
            required
            class="w-full px-4 py-3.5 border border-slate-300 rounded-xl outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-100 transition">
        </div>

        <button
          type="submit"
          id="login-submit-btn"
          class="w-full py-4 bg-brand-600 text-white rounded-xl font-semibold hover:bg-brand-700 transition shadow-md shadow-indigo-100">
          Sign In
        </button>

      </form>

      <!-- REGISTER LINK -->
      <div class="text-center mt-8 pt-6 border-t border-slate-100">
        <p class="text-sm text-slate-500">
          Need an organizer account?
          <a href="/register.html"
            class="text-brand-600 font-semibold hover:text-brand-700">
            Register
          </a>
        </p>
      </div>

    </section>
  </main>
</body>
</html>
